<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vampire Widget — управление</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090b;color:#eee;font:15px Arial,sans-serif}
.box{width:min(760px,calc(100vw - 32px));margin:24px auto;background:#17171b;border:1px solid #555;border-radius:14px;padding:24px}
h1{margin:0 0 8px;color:#e62b32;font-size:25px}
p{color:#bbb;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
label{display:block;color:#bbb;margin-bottom:6px}
input{width:100%;padding:12px;border:1px solid #555;border-radius:8px;background:#0e0e12;color:#fff;font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{padding:12px 18px;border:0;border-radius:8px;background:#9b1420;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#2b2b31}
.status{margin-top:16px;padding:12px;background:#0e0e12;border-radius:8px}
.ok{color:#70ee88}
.hint{color:#888;font-size:13px;margin-top:10px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="box">
<h1>🩸 Vampire Widget — управление</h1>
<p>Эта страница нужна только для управления виджетом. Открой её через <b>«Взаимодействовать / Interact»</b> у отдельного Browser Source в OBS.</p>

<div class="grid">
  <div>
    <label for="current">Текущая сумма, ₽</label>
    <input id="current" type="number" min="0" step="1">
  </div>
  <div>
    <label for="goal">Цель, ₽</label>
    <input id="goal" type="number" min="1" step="1">
  </div>
</div>

<div class="row">
  <button id="save">💾 Сохранить и обновить виджет</button>
  <button id="add50" class="secondary">+50 ₽</button>
  <button id="add100" class="secondary">+100 ₽</button>
</div>

<div class="status" id="status">Готово.</div>
<div class="hint">Настройки сохраняются в OBS. Основной виджет менять URL не нужно.</div>
</main>

<script>
(()=> {
  const cur=document.getElementById('current');
  const goal=document.getElementById('goal');
  const status=document.getElementById('status');
  const token=localStorage.getItem('vampire_access_token')||'';
  const cfg=window.VAMPIRE_CONFIG||{};
  const proxy=(localStorage.getItem('vampire_proxy_url')||cfg.PROXY_URL||'').replace(/\/$/,'');
  const API=proxy?proxy+'/api/v1':'';

  async function api(path,opts={}){
    const r=await fetch(API+path,{...opts,headers:{
      ...(opts.headers||{}),
      Authorization:'Bearer '+token,
      'Content-Type':'application/json'
    }});
    const tx=await r.text(); let data={}; try{data=JSON.parse(tx)}catch{}
    if(!r.ok) throw new Error(data.message||data.error||('HTTP '+r.status));
    return data;
  }

  async function load(){
    if(!token){status.textContent='Нет авторизации. Сначала подключите DonationAlerts.';return;}
    try{
      const s=await api('/state');
      cur.value=Number.isFinite(Number(s.current))?Number(s.current):0;
      goal.value=Number.isFinite(Number(s.goal))&&Number(s.goal)>0?Number(s.goal):10000;
      status.innerHTML='<span class="ok">Подключено. Общие настройки загружены.</span>';
    }catch(e){
      status.innerHTML='<span class="bad">'+e.message+'</span>';
    }
  }

  async function save(){
    try{
      const c=Math.max(0,Number(cur.value)||0);
      const g=Math.max(1,Number(goal.value)||10000);
      await api('/state',{method:'POST',body:JSON.stringify({current:c,goal:g})});
      status.innerHTML='<span class="ok">Сохранено: '+c.toLocaleString('ru-RU')+' ₽ / '+g.toLocaleString('ru-RU')+' ₽</span>';
    }catch(e){
      status.innerHTML='<span class="bad">'+e.message+'</span>';
    }
  }

  document.getElementById('save').onclick=save;
  document.getElementById('add50').onclick=()=>{cur.value=(Number(cur.value)||0)+50;save();};
  document.getElementById('add100').onclick=()=>{cur.value=(Number(cur.value)||0)+100;save();};

  load();
})();
</script>
</body>
</html>
