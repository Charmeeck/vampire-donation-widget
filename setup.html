<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vampire Donation Widget — настройка</title><style>body{margin:0;background:#09090b;color:#eee;font:16px Arial,sans-serif;display:flex;justify-content:center;padding:40px}.box{max-width:680px;width:100%;background:#17171b;border:1px solid #555;border-radius:14px;padding:28px;box-sizing:border-box}h1{margin-top:0;color:#d22}p{line-height:1.5;color:#ccc}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin:12px 0 6px;color:#aaa}input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #555;background:#0d0d10;color:#fff;font-size:16px}button{margin-top:18px;padding:13px 18px;border:0;border-radius:8px;background:#8f1018;color:#fff;font-weight:bold;cursor:pointer}.status{margin-top:18px;padding:12px;border-radius:8px;background:#101014;color:#bbb}.url{word-break:break-all;color:#f3b1b1}</style></head><body><main class="box"><h1>🩸 Vampire Donation Widget</h1><p>Эта страница нужна для настройки виджета. DonationAlerts подключается к каждому стримеру отдельно.</p><div class="row"><div><label>Текущая сумма</label><input id="current" type="number" min="0" value="0"></div><div><label>Цель</label><input id="goal" type="number" min="1" value="10000"></div></div><button id="save">Сохранить настройки</button><button id="auth">Подключить DonationAlerts</button><div id="status" class="status">Статус: не подключено</div><div id="result" class="status" hidden><b>Ссылка для OBS:</b><div class="url" id="obsUrl"></div></div></main><script src="config.js"></script><script>const K='vampire_settings';const c=document.querySelector('#current'),g=document.querySelector('#goal'),s=document.querySelector('#status'),r=document.querySelector('#result'),u=document.querySelector('#obsUrl');try{const x=JSON.parse(localStorage.getItem(K)||'{}');if(x.current!=null)c.value=x.current;if(x.goal!=null)g.value=x.goal}catch{}document.querySelector('#save').onclick=()=>{const x={current:Number(c.value)||0,goal:Number(g.value)||10000};localStorage.setItem(K,JSON.stringify(x));s.textContent='Настройки сохранены.'};document.querySelector('#auth').onclick=()=>{const id=window.VAMPIRE_CONFIG.CLIENT_ID;if(!id||id.includes('PASTE_')){s.textContent='Сначала укажи Client ID в config.js.';return}const x={current:Number(c.value)||0,goal:Number(g.value)||10000};localStorage.setItem(K,JSON.stringify(x));const q=new URLSearchParams({client_id:id,redirect_uri:window.VAMPIRE_CONFIG.REDIRECT_URI,response_type:'token',scope:'oauth-user-show oauth-goal-subscribe'});location.href='https://www.donationalerts.com/oauth/authorize?'+q.toString()};const token=new URLSearchParams(location.hash.slice(1)).get('access_token');if(token){localStorage.setItem('vampire_access_token',token);history.replaceState({},'',location.pathname);s.textContent='DonationAlerts подключён. Открой ссылку ниже в OBS.';const obs=new URL(window.VAMPIRE_CONFIG.REDIRECT_URI);u.textContent=obs.href;r.hidden=false}</script></body></html>
