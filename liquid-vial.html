<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=380,height=411,initial-scale=1"><title>Vampire Vial</title><style>html,body{margin:0;width:380px;height:411px;background:transparent;overflow:hidden}svg{display:block;width:380px;height:411px}.hud{position:absolute;left:-9999px}</style></head><body><svg viewBox="0 0 380 411" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="cavity"><rect x="108" y="52" width="164" height="248" rx="52"/></clipPath><linearGradient id="blood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3040"/><stop offset=".42" stop-color="#c20f1f"/><stop offset="1" stop-color="#5a030a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/></filter></defs><g clip-path="url(#cavity)"><rect id="bloodGlow" x="108" y="300" width="164" height="0" fill="#ff2030" opacity=".28" filter="url(#glow)"/><rect id="blood" x="108" y="300" width="164" height="0" fill="url(#blood)"/><ellipse id="wave" cx="190" cy="300" rx="82" ry="9" fill="#e91b2d" opacity=".9"/></g><image href="vial-frame-clean.png" x="0" y="0" width="380" height="411" preserveAspectRatio="none"/><script src="config.js"></script><script>
const params=new URLSearchParams(location.search);const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function setProgress(current,goal){current=Number(current)||0;goal=Number(goal)||1;const pct=clamp(current/goal*100,0,100),bottom=300,top=bottom-248*pct/100,height=bottom-top;document.getElementById('blood').setAttribute('y',top);document.getElementById('blood').setAttribute('height',height);document.getElementById('bloodGlow').setAttribute('y',top-2);document.getElementById('bloodGlow').setAttribute('height',height+4);document.getElementById('wave').setAttribute('cy',top);}
window.setDonationProgress=setProgress;
let settings={current:Number(params.get('current')||0),goal:Number(params.get('goal')||10000)};try{const x=JSON.parse(localStorage.getItem('vampire_settings')||'{}');if(!params.has('current')&&x.current!=null)settings.current=Number(x.current);if(!params.has('goal')&&x.goal!=null)settings.goal=Number(x.goal)}catch{}if(params.has('demo'))settings.current+=Number(params.get('demo'))||0;setProgress(settings.current,settings.goal);
async function connect(){const token=new URLSearchParams(location.hash.slice(1)).get('access_token')||localStorage.getItem('vampire_access_token');if(token){localStorage.setItem('vampire_access_token',token);if(location.hash)history.replaceState({},'',location.pathname+location.search)}else{const id=window.VAMPIRE_CONFIG&&window.VAMPIRE_CONFIG.CLIENT_ID;if(id&&!id.includes('PASTE_')){const q=new URLSearchParams({client_id:id,redirect_uri:window.VAMPIRE_CONFIG.REDIRECT_URI,response_type:'token',scope:'oauth-user-show oauth-goal-subscribe'});location.replace('https://www.donationalerts.com/oauth/authorize?'+q.toString())}return}
try{const me=await fetch('https://www.donationalerts.com/api/v1/user/oauth',{headers:{Authorization:'Bearer '+token}}).then(r=>{if(!r.ok)throw Error('API '+r.status);return r.json()});const user=me.data;const ws=new WebSocket('wss://centrifugo.donationalerts.com/connection/websocket');ws.onopen=()=>ws.send(JSON.stringify({params:{token:user.socket_connection_token},id:1}));ws.onmessage=async ev=>{const msg=JSON.parse(ev.data);if(msg.id===1&&msg.result&&msg.result.client){const resp=await fetch('https://www.donationalerts.com/api/v1/centrifuge/subscribe',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({channels:['$goals:goal_'+user.id],client:msg.result.client})});const data=await resp.json();const sub=data.channels&&data.channels[0];if(sub)ws.send(JSON.stringify({params:{channel:sub.channel,token:sub.token},method:1,id:2}));}else if(msg.result&&msg.result.type===1&&msg.result.channel&&msg.result.channel.startsWith('$goals:goal_')){const d=msg.result.data&&msg.result.data.data?msg.result.data.data:msg.result.data;if(d&&d.goal_amount!=null&&d.raised_amount!=null)setProgress(d.raised_amount,d.goal_amount);}};ws.onerror=()=>{};ws.onclose=()=>setTimeout(connect,5000)}catch(e){setTimeout(connect,10000)}}connect();
</script></svg></body></html>
