<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=380,height=411,initial-scale=1">
<title>Vampire Vial</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.scene{position:relative;width:380px;height:411px}
svg{position:absolute;inset:0;width:380px;height:411px}
</style>
</head>
<body>
<div class="scene">
<svg viewBox="0 0 380 411" xmlns="http://www.w3.org/2000/svg">

  <!-- Точная форма внутренней полости колбы -->
  <defs>
    <clipPath id="cavity">
      <rect x="108" y="52" width="164" height="248" rx="52"/>
    </clipPath>

    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4352"/>
      <stop offset=".42" stop-color="#d5001d"/>
      <stop offset="1" stop-color="#72000d"/>
    </linearGradient>

    <radialGradient id="shine" cx=".3" cy=".2">
      <stop offset="0" stop-color="#ffb0b0" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#ff3045" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- КРОВЬ. Ничего за пределами clipPath физически не рисуется. -->
  <g clip-path="url(#cavity)">
    <rect id="blood" x="108" y="182.2" width="164" height="118"
          fill="url(#blood)"/>

    <ellipse id="wave" cx="190" cy="182.2" rx="82" ry="9"
             fill="#ff5360"/>

    <rect x="108" y="182.2" width="164" height="118"
          fill="url(#shine)" opacity=".75"/>
  </g>

  <!-- Небольшие стеклянные блики внутри -->
  <g clip-path="url(#cavity)" opacity=".16">
    <rect x="116" y="55" width="14" height="240" rx="7" fill="white"/>
    <rect x="250" y="55" width="10" height="240" rx="5" fill="white"/>
  </g>

  <!-- Металлическая рамка ПОВЕРХ крови -->
  <image href="vial-frame-clean.png"
         x="0" y="0" width="380" height="411"
         preserveAspectRatio="none"/>
</svg>
</div>

<script>
const state={current:4750,goal:10000};

function setProgress(current,goal=state.goal){
  current=Number(current);
  goal=Number(goal);
  if(!Number.isFinite(current)||!Number.isFinite(goal)||goal<=0)return;

  state.current=Math.max(0,current);
  state.goal=goal;

  const pct=Math.max(0,Math.min(100,state.current/state.goal*100));

  // Верх жидкости: 300 = дно, 52 = верх.
  const bottom=300;
  const top=bottom-(248*pct/100);
  const height=bottom-top;

  document.getElementById("blood").setAttribute("y",top);
  document.getElementById("blood").setAttribute("height",height);
  document.getElementById("wave").setAttribute("cy",top);
}

const p=new URLSearchParams(location.search);

if(p.has("current")) state.current=Number(p.get("current"))||state.current;
if(p.has("goal")) state.goal=Number(p.get("goal"))||state.goal;

setProgress(state.current,state.goal);

if(p.has("demo")){
  const add=Number(p.get("demo"))||1000;
  setTimeout(()=>setProgress(state.current+add,state.goal),1000);
}

window.setDonationProgress=setProgress;
</script>
</body>
</html>
