<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vampire Widget — диагностика v19</title><style>body{margin:0;background:#101014;color:#eee;font:15px Arial,sans-serif;padding:24px}.box{max-width:820px;margin:auto;background:#1a1a20;border:1px solid #555;border-radius:14px;padding:22px}h1{margin:0 0 12px;color:#ff3344;font-size:24px}.item{padding:10px 12px;margin:8px 0;background:#0d0d11;border-radius:8px}.ok{color:#63e67a}.bad{color:#ff6b78}.wait{color:#ddd}button,a{display:inline-block;padding:11px 16px;border-radius:8px;border:0;text-decoration:none;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}button{background:#9b1420;color:#fff}.secondary{background:#333;color:#fff}</style></head><body><div class="box"><h1>🩸 Vampire Widget — диагностика v19</h1><p>Проверяем Worker, OAuth, историю донатов и Centrifugo. Access token не показывается.</p><div id="out"></div><div style="margin-top:14px"><a class="secondary" href="./setup.html">← Назад в настройки</a><button id="reauth">🔗 Переподключить DonationAlerts</button><button id="run">🔄 Повторить</button></div></div><script src="config.js"></script><script>
(()=>{const out=document.getElementById('out'),cfg=window.VAMPIRE_CONFIG||{},proxy=(localStorage.getItem('vampire_proxy_url')||cfg.PROXY_URL||'').replace(/\/$/,''),API=proxy?proxy+'/api/v1':'',WS='wss://centrifugo.donationalerts.com/connection/websocket',esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const row=(n,v,k='wait')=>{const d=document.createElement('div');d.className='item';d.innerHTML='<b>'+esc(n)+':</b> <span class="'+k+'">'+esc(v)+'</span>';out.appendChild(d);return d};const authUrl=()=>{const u=new URL('https://www.donationalerts.com/oauth/authorize');u.searchParams.set('client_id',String(cfg.CLIENT_ID||'21478'));u.searchParams.set('redirect_uri',String(cfg.REDIRECT_URI||'https://charmeeck.github.io/vampire-donation-widget/'));u.searchParams.set('response_type','token');u.searchParams.set('scope','oauth-user-show oauth-goal-subscribe oauth-donation-subscribe oauth-donation-index');return u.toString()};document.getElementById('reauth').onclick=()=>location.href=authUrl();async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+(localStorage.getItem('vampire_access_token')||''),'Content-Type':'application/json'}});const tx=await r.text();let data={};try{data=JSON.parse(tx)}catch{}if(!r.ok)throw new Error((data&&data.message)||('HTTP '+r.status));return data}async function run(){out.innerHTML='';const t=localStorage.getItem('vampire_access_token')||'';row('Worker proxy',proxy||'НЕ задан',proxy?'ok':'bad');row('Токен',t?'найден':'НЕ найден',t?'ok':'bad');if(!t||!API)return;try{const me=await api('/user/oauth');const u=me.data||me;row('API через Worker','OK — user_id '+u.id,'ok');row('socket_connection_token',u.socket_connection_token?'получен':'НЕ получен',u.socket_connection_token?'ok':'bad');}catch(e){row('API через Worker',e.message,'bad');return}try{const d=await api('/alerts/donations?page=1');const list=Array.isArray(d.data)?d.data:[];row('История донатов','доступна — записей на странице: '+list.length,'ok')}catch(e){row('История донатов',e.message,'bad')}try{const me=await api('/user/oauth');const u=me.data||me;const ws=new WebSocket(WS);ws.onopen=()=>{row('WebSocket','открыт','ok');ws.send(JSON.stringify({params:{token:u.socket_connection_token},id:1}))};ws.onerror=()=>row('WebSocket','ошибка','bad');ws.onmessage=async ev=>{let m;try{m=JSON.parse(ev.data)}catch{return}if(m.id===1&&m.result?.client){row('Centrifugo client','получен','ok');const channels=[`$alerts:donation_${u.id}`,`$goals:goal_${u.id}`];try{const s=await api('/centrifuge/subscribe',{method:'POST',body:JSON.stringify({channels,client:m.result.client})});row('Подписка','получено токенов: '+((s.channels||[]).length),'ok');(s.channels||[]).forEach(c=>{if(c.channel&&c.token)ws.send(JSON.stringify({method:1,params:{channel:c.channel,token:c.token},id:Math.floor(Math.random()*1e6)+2}))})}catch(e){row('Подписка',e.message,'bad')}}else if(m.push){const ch=m.push.channel||'';row('Событие',ch,'ok');}}}catch(e){row('WebSocket старт',e.message,'bad')}}document.getElementById('run').onclick=run;run()})();</script></div></body></html>
