<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vampire Widget — диагностика</title><style>body{margin:0;background:#101014;color:#eee;font:15px Arial,sans-serif;padding:24px}.box{max-width:760px;margin:auto;background:#1a1a20;border:1px solid #555;border-radius:14px;padding:22px}h1{margin:0 0 12px;color:#ff3344;font-size:24px}button,a{display:inline-block;padding:11px 16px;border-radius:8px;border:0;text-decoration:none;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}button{background:#9b1420;color:#fff}.secondary{background:#333;color:#fff}.item{padding:10px 12px;margin:8px 0;background:#0d0d11;border-radius:8px}.ok{color:#63e67a}.bad{color:#ff6b78}.wait{color:#ddd}.mono{font-family:Consolas,monospace;font-size:13px;word-break:break-word}small{color:#aaa}</style></head><body><div class="box"><h1>🩸 Vampire Widget — диагностика DonationAlerts</h1><p>Проверяем прокси, авторизацию и подключение к Centrifugo. Access token не показывается.</p><div id="out"></div><div style="margin-top:14px"><a class="secondary" href="./setup.html">← Назад в настройки</a><button id="reauth">🔗 Переподключить DonationAlerts</button><button id="run">🔄 Повторить</button></div><small>Токен не выводится.</small></div><script src="config.js"></script><script>
(()=>{const out=document.getElementById('out'),cfg=window.VAMPIRE_CONFIG||{},proxy=(localStorage.getItem('vampire_proxy_url')||cfg.PROXY_URL||'').replace(/\/$/,'');const API=proxy?proxy+'/api/v1':'';const WS='wss://centrifugo.donationalerts.com/connection/websocket';const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const row=(n,v,k='wait')=>{const d=document.createElement('div');d.className='item';d.innerHTML='<b>'+esc(n)+':</b> <span class="'+k+'">'+esc(v)+'</span>';out.appendChild(d);return d};
 const authUrl=()=>{const u=new URL('https://www.donationalerts.com/oauth/authorize');u.searchParams.set('client_id',String(cfg.CLIENT_ID||'21478'));u.searchParams.set('redirect_uri',String(cfg.REDIRECT_URI||'https://charmeeck.github.io/vampire-donation-widget/'));u.searchParams.set('response_type','token');u.searchParams.set('scope','oauth-user-show oauth-goal-subscribe oauth-donation-subscribe');return u.toString()};document.getElementById('reauth').onclick=()=>location.href=authUrl();
 async function api(path,token,opts={}){const r=await fetch(API+path,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'}});const tx=await r.text();let data={};try{data=JSON.parse(tx)}catch{}if(!r.ok)throw new Error((data&&data.message)||('HTTP '+r.status));return data;}
 async function run(){out.innerHTML='';const token=localStorage.getItem('vampire_access_token')||'';row('Worker proxy',proxy||'НЕ задан',proxy?'ok':'bad');row('Токен',token?'найден':'НЕ найден',token?'ok':'bad');if(!proxy){row('Действие','Открой setup.html и сохрани URL Cloudflare Worker.',false);return;}if(!token){row('Действие','Подключи DonationAlerts через setup.html.',false);return;}let user;try{const me=await api('/user/oauth',token);user=me.data||me;row('API через Worker','OK — user_id '+(user.id??'?'),'ok');}catch(e){row('API через Worker',e.message,'bad');return;}row('socket_connection_token',user.socket_connection_token?'получен':'НЕ получен',user.socket_connection_token?'ok':'bad');if(!user.socket_connection_token)return;const ws=new WebSocket(WS),wr=row('WebSocket','подключение…');ws.onopen=()=>{wr.innerHTML='<b>WebSocket:</b> <span class="ok">открыт</span>';ws.send(JSON.stringify({params:{token:user.socket_connection_token},id:1}))};ws.onerror=()=>wr.innerHTML='<b>WebSocket:</b> <span class="bad">ошибка</span>';ws.onmessage=async ev=>{let msg;try{msg=JSON.parse(ev.data)}catch{return}if(msg.id===1&&msg.result&&msg.result.client){row('Centrifugo client','получен','ok');const channels=[`$goals:goal_${user.id}`,`$alerts:donation_${user.id}`];try{const sub=await api('/centrifuge/subscribe',token,{method:'POST',body:JSON.stringify({channels,client:msg.result.client})});const creds=Array.isArray(sub.channels)?sub.channels:[];row('Подписка','получено токенов: '+creds.length,creds.length?'ok':'bad');creds.forEach(c=>row('Канал',c.channel+(c.token?' — токен OK':' — нет токена'),c.token?'ok':'bad'));creds.forEach(c=>{if(c.channel&&c.token)ws.send(JSON.stringify({method:1,params:{channel:c.channel,token:c.token},id:Math.floor(Math.random()*1e6)+2}))});row('GOAL','ждём новое событие цели…','wait')}catch(e){row('POST /centrifuge/subscribe',e.message,'bad')}return;}if(msg.result&&msg.result.type===1&&msg.result.channel){row('Канал подключён',msg.result.channel,'ok');return;}if(msg.push){const ch=msg.push.channel||'';const data=(msg.push.pub&&msg.push.pub.data)||msg.push.pub||{};row('Событие',ch+' → '+JSON.stringify(data).slice(0,500),'ok');if(ch.startsWith('$goals:goal_')){let d=data;for(let i=0;i<3;i++){if(d&&d.data&&typeof d.data==='object')d=d.data;else break}row('raised_amount',d.raised_amount??'нет','ok');row('goal_amount',d.goal_amount??'нет','ok')}}};}
document.getElementById('run').onclick=run;run();})();</script></body></html>
