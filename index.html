<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1672,height=941,initial-scale=1">
<title>Vampire Donation Widget</title>
<style>
html,body{margin:0;width:1672px;height:941px;background:transparent;overflow:hidden}
#stage,.layer{position:absolute;left:0;top:0;width:1672px;height:941px}
.text{font-family:Georgia,"Times New Roman",serif;font-weight:700;fill:#fff;paint-order:stroke;stroke:#1b0a0a;stroke-width:3px}
.sum{font-size:30px}
</style>
</head>
<body>
<div id="stage">
  <img class="layer" src="altar.png" alt="">
  <svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <clipPath id="clip"><rect x="707" y="350" width="264" height="455" rx="62"/></clipPath>
      <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff5864"/><stop offset=".18" stop-color="#ed1c35"/><stop offset=".6" stop-color="#a70018"/><stop offset="1" stop-color="#4d0009"/>
      </linearGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
    </defs>
    <g clip-path="url(#clip)">
      <image id="tex" href="blood-texture.png" x="707" y="350" width="264" height="455" preserveAspectRatio="none" opacity=".66"/>
      <rect id="tint" x="707" y="350" width="264" height="455" fill="url(#blood)" opacity=".42"/>
      <ellipse id="surface" cx="839" cy="805" rx="128" ry="10" fill="#ff4657" opacity=".9" filter="url(#blur)"/>
    </g>
    <g opacity=".38"><rect x="721" y="360" width="18" height="430" rx="9" fill="#fff"/><rect x="918" y="360" width="11" height="425" rx="5.5" fill="#fff"/></g>
  </svg>
  <svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg">
    <text id="sumCurrent" class="text sum" x="220" y="203" text-anchor="start" dominant-baseline="middle">0 ₽</text>
    <text id="sumGoal" class="text sum" x="1450" y="203" text-anchor="end" dominant-baseline="middle">10 000 ₽</text>
  </svg>
</div>
<script src="config.js"></script>
<script>
(()=> {
  const CFG=window.VAMPIRE_CONFIG||{};
  const q=new URLSearchParams(location.search);
  const rawHash=location.hash.replace(/^#/,'').replace(/^\?/,'');
  const hash=new URLSearchParams(rawHash);
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d};
  const tokenFromHash=hash.get("access_token");
  if(tokenFromHash){localStorage.setItem("vampire_access_token",tokenFromHash);history.replaceState({}, "", location.pathname+location.search);}
  let current=num(q.get("current"),num(localStorage.getItem("vampire_current"),0));
  let goal=num(q.get("goal"),num(localStorage.getItem("vampire_goal"),10000));
  if(current<0)current=0;
  if(goal<=0)goal=10000;
  let accessToken=localStorage.getItem("vampire_access_token")||"";
  const proxy=(localStorage.getItem("vampire_proxy_url")||CFG.PROXY_URL||"").replace(/\/$/,"");
  const API=proxy?proxy+"/api/v1":"";
  const WS="wss://centrifugo.donationalerts.com/connection/websocket";
  let socket=null,reconnectTimer=null;
  let lastDonationId=Number(localStorage.getItem("vampire_last_donation_id"))||0;
  let historyInitialized=localStorage.getItem("vampire_history_initialized")==="1";
  const seenIds=new Set((localStorage.getItem("vampire_seen_donations")||"").split(",").filter(Boolean));
  function currencySymbol(code){return ({RUB:"₽",EUR:"€",USD:"$",GBP:"£",KZT:"₸",UAH:"₴",BYN:"Br"})[code]||"₽";}
  function render(c,g,symbol){
    c=num(c);g=num(g,1);const p=clamp(c/g*100,0,100);
    const bottom=805,full=455,top=Math.round(bottom-full*p/100),h=Math.max(0,bottom-top);
    document.getElementById("tex").setAttribute("y",top);
    document.getElementById("tex").setAttribute("height",h);
    document.getElementById("tint").setAttribute("y",top);
    document.getElementById("tint").setAttribute("height",h);
    document.getElementById("surface").setAttribute("cy",top);
    document.getElementById("sumCurrent").textContent=Math.round(c).toLocaleString("ru-RU")+" "+(symbol||"₽");
    document.getElementById("sumGoal").textContent=Math.round(g).toLocaleString("ru-RU")+" "+(symbol||"₽");
    localStorage.setItem("vampire_current",String(c));
    localStorage.setItem("vampire_goal",String(g));
  }
  render(current,goal,"₽");
  if(q.has("demo")){const add=num(q.get("demo"),1000);setTimeout(()=>render(current+add,goal,"₽"),500);}
  async function api(path,opts={}){
    if(!API)throw new Error("Worker proxy не настроен");
    const headers={...(opts.headers||{}),Authorization:"Bearer "+accessToken};
    if(opts.method==="POST")headers["Content-Type"]="application/json";
    const response=await fetch(API+path,{...opts,headers});
    const text=await response.text();let data={};try{data=JSON.parse(text)}catch{}
    if(!response.ok)throw new Error((data&&data.message)||("HTTP "+response.status));
    return data;
  }
  function rememberDonation(id){if(id===undefined||id===null)return;seenIds.add(String(id));const arr=[...seenIds].slice(-300);localStorage.setItem("vampire_seen_donations",arr.join(","));}
  function findResource(value,depth=0){
    if(!value||typeof value!=="object"||depth>8)return null;
    if(Number.isFinite(Number(value.goal_amount))&&Number.isFinite(Number(value.raised_amount)))return {type:"goal",data:value};
    if(Number.isFinite(Number(value.amount))&&value.currency)return {type:"donation",data:value};
    if(Array.isArray(value)){for(const item of value){const f=findResource(item,depth+1);if(f)return f;}return null;}
    for(const key of Object.keys(value)){const f=findResource(value[key],depth+1);if(f)return f;}
    return null;
  }
  function applyGoalPayload(payload){
    const found=findResource(payload);if(!found||found.type!=="goal")return false;
    const g=found.data;const raised=num(g.raised_amount,NaN),target=num(g.goal_amount,NaN);
    if(!Number.isFinite(raised)||!Number.isFinite(target)||target<=0)return false;
    current=raised;goal=target;render(current,goal,currencySymbol(g.currency));return true;
  }
  function applyDonationPayload(payload){
    const found=findResource(payload);if(!found||found.type!=="donation")return false;
    const d=found.data,amount=num(d.amount,NaN);if(!Number.isFinite(amount)||amount<=0)return false;
    const id=d.id;if(id!==undefined&&id!==null&&seenIds.has(String(id)))return false;
    if(id!==undefined&&id!==null){rememberDonation(id);const n=Number(id);if(Number.isFinite(n)){lastDonationId=Math.max(lastDonationId,n);localStorage.setItem("vampire_last_donation_id",String(lastDonationId));}}
    current+=amount;render(current,goal,currencySymbol(d.currency));return true;
  }
  async function syncDonationHistory(){
    if(!accessToken||!API)return;
    try{
      const result=await api("/alerts/donations?page=1");
      const list=Array.isArray(result.data)?result.data:[];if(!list.length)return;
      list.sort((a,b)=>(Number(a.id)||0)-(Number(b.id)||0));
      if(!historyInitialized){
        list.forEach(d=>{if(d.id!==undefined&&d.id!==null)rememberDonation(d.id);});
        lastDonationId=Number(list[list.length-1].id)||0;
        localStorage.setItem("vampire_last_donation_id",String(lastDonationId));
        historyInitialized=true;localStorage.setItem("vampire_history_initialized","1");return;
      }
      for(const d of list){const id=Number(d.id)||0;if(id>lastDonationId)applyDonationPayload(d);}
      localStorage.setItem("vampire_last_donation_id",String(lastDonationId));
    }catch(e){console.warn("Donation history sync failed:",e);}
  }
  async function connect(){
    if(!accessToken||!API)return;
    if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null;}
    try{
      const me=await api("/user/oauth"),user=me.data||me;
      if(!user.id||!user.socket_connection_token)throw new Error("DonationAlerts profile/token unavailable");
      socket=new WebSocket(WS);
      socket.onopen=()=>socket.send(JSON.stringify({params:{token:user.socket_connection_token},id:1}));
      socket.onmessage=async(event)=>{
        let msg;try{msg=JSON.parse(event.data)}catch{return;}
        if(msg.id===1&&msg.result&&msg.result.client){
          const channels=["$alerts:donation_"+user.id,"$goals:goal_"+user.id];
          try{
            const sub=await api("/centrifuge/subscribe",{method:"POST",body:JSON.stringify({channels:channels,client:msg.result.client})});
            const creds=Array.isArray(sub.channels)?sub.channels:[];
            creds.forEach((entry,index)=>{if(!entry.channel||!entry.token)return;socket.send(JSON.stringify({method:1,params:{channel:entry.channel,token:entry.token},id:100+index}));});
          }catch(e){console.warn("DonationAlerts subscribe failed:",e);}
          return;
        }
        if(msg.push){
          const channel=msg.push.channel||"",publication=msg.push.pub||{},payload=publication.data!==undefined?publication.data:publication;
          if(channel.indexOf("$goals:goal_")===0)applyGoalPayload(payload);
          else if(channel.indexOf("$alerts:donation_")===0)applyDonationPayload(payload);
        }
      };
      socket.onerror=e=>console.warn("DonationAlerts WebSocket error",e);
      socket.onclose=()=>{reconnectTimer=setTimeout(connect,5000);};
    }catch(e){console.warn("DonationAlerts connection failed:",e);reconnectTimer=setTimeout(connect,5000);}
  }
  if(accessToken&&API){syncDonationHistory();setInterval(syncDonationHistory,5000);connect();}
})();
</script>
</body>
</html>
