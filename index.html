<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кровавый алтарь</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="widget" id="widget">
  <img class="art" src="altar.png" alt="">
  <div class="dynamic-bar" aria-hidden="true">
    <div class="dynamic-fill" id="fill"></div>
    <div class="bar-shine"></div>
    <div class="bar-text">
      <span id="amount">3 750 ₽</span>
      <span class="sep">/</span>
      <span id="goal">10 000 ₽</span>
    </div>
    <div class="percent" id="percent">37%</div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="donation" id="donation"></div>
</div>
<script src="script.js"></script>
</body>
</html>
