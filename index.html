<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vampire Donation Widget</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="widget">
  <div class="art-frame">
    <img class="art" src="altar.png" alt="">
    <div class="dynamic-bar">
      <div class="dynamic-fill" id="fill"></div>
      <div class="bar-shine"></div>
      <div class="bar-text"><span id="amount">3 750 ₽</span><span class="sep">/</span><span id="goal">10 000 ₽</span></div>
      <div class="percent" id="percent">38%</div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
