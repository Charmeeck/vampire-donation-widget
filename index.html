<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1672,height=941,initial-scale=1">
<title>Vampire Donation Widget</title>
<style>
html,body{margin:0;width:1672px;height:941px;background:transparent;overflow:hidden}
#stage,.layer{position:absolute;left:0;top:0;width:1672px;height:941px}
.text{font-family:Georgia,"Times New Roman",serif;font-weight:700;fill:#fff;paint-order:stroke;stroke:#1b0a0a;stroke-width:3px}
.sum{font-size:30px}
</style>
</head>
<body>
<div id="stage">
  <img class="layer" src="altar.png" alt="">
  <svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <clipPath id="clip"><rect x="707" y="350" width="264" height="455" rx="62"/></clipPath>
      <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff5864"/><stop offset=".18" stop-color="#ed1c35"/><stop offset=".6" stop-color="#a70018"/><stop offset="1" stop-color="#4d0009"/>
      </linearGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
    </defs>
    <g clip-path="url(#clip)">
      <image id="tex" href="blood-texture.png" x="707" y="350" width="264" height="455" preserveAspectRatio="none" opacity=".66"/>
      <rect id="tint" x="707" y="350" width="264" height="455" fill="url(#blood)" opacity=".42"/>
      <ellipse id="surface" cx="839" cy="805" rx="128" ry="10" fill="#ff4657" opacity=".9" filter="url(#blur)"/>
    </g>
    <g opacity=".38"><rect x="721" y="360" width="18" height="430" rx="9" fill="#fff"/><rect x="918" y="360" width="11" height="425" rx="5.5" fill="#fff"/></g>
  </svg>
  <svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg">
    <text id="sumCurrent" class="text sum" x="220" y="203" text-anchor="start" dominant-baseline="middle">0 ₽</text>
    <text id="sumGoal" class="text sum" x="1450" y="203" text-anchor="end" dominant-baseline="middle">10 000 ₽</text>
  </svg>
</div>
<script src="config.js"></script>
<script>
(()=>{
  const CFG=window.VAMPIRE_CONFIG||{};
  const q=new URLSearchParams(location.search);
  const hash=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/,'').replace(/&+/g,'&'));
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d};
  if(hash.get('access_token')){localStorage.setItem('vampire_access_token',hash.get('access_token'));history.replaceState({},'',location.pathname+location.search)}

  const storedCurrent=Number(localStorage.getItem('vampire_current'));
  const storedGoal=Number(localStorage.getItem('vampire_goal'));
  let current=num(q.get('current'),Number.isFinite(storedCurrent)&&storedCurrent>=0?storedCurrent:0);
  let goal=num(q.get('goal'),Number.isFinite(storedGoal)&&storedGoal>0?storedGoal:10000);
  if(!Number.isFinite(current)||current<0) current=0;
  if(!Number.isFinite(goal)||goal<=0) goal=10000;

  let accessToken=localStorage.getItem('vampire_access_token')||'';
  const proxy=(localStorage.getItem('vampire_proxy_url')||CFG.PROXY_URL||'').replace(/\/$/,'');
  const API=proxy?proxy+'/api/v1':'';
  const WS='wss://centrifugo.donationalerts.com/connection/websocket';
  let socket=null;
  let lastDonationId=Number(localStorage.getItem('vampire_last_donation_id'))||0;
  let historyInitialized=localStorage.getItem('vampire_history_initialized')==='1';
  const seenIds=new Set((localStorage.getItem('vampire_seen_donations')||'').split(',').filter(Boolean));

  function currencySymbol(code){return ({RUB:'₽',EUR:'€',USD:'$',GBP:'£',KZT:'₸',UAH:'₴',BYN:'Br'})[code]||'₽'}
  function render(c,g,symbol='₽'){
    c=num(c);g=num(g,1);const p=clamp(c/g*100,0,100);
    const bottom=805,full=455,top=Math.round(bottom-full*p/100),h=Math.max(0,bottom-top);
    document.getElementById('tex').setAttribute('y',top);document.getElementById('tex').setAttribute('height',h);
    document.getElementById('tint').setAttribute('y',top);document.getElementById('tint').setAttribute('height',h);document.getElementById('surface').setAttribute('cy',top);
    document.getElementById('sumCurrent').textContent=Math.round(c).toLocaleString('ru-RU')+' '+symbol;
    document.getElementById('sumGoal').textContent=Math.round(g).toLocaleString('ru-RU')+' '+symbol;
    localStorage.setItem('vampire_current',String(c));localStorage.setItem('vampire_goal',String(g));
  }
  render(current,goal,'₽');
  if(q.has('demo')){const add=num(q.get('demo'),1000);setTimeout(()=>render(current+add,goal,'₽'),700)}

  async function api(path,opts={}){
    if(!API) throw new Error('Worker proxy не настроен');
    const headers={...(opts.headers||{}),Authorization:'Bearer '+accessToken};
    if(opts.method==='POST') headers['Content-Type']='application/json';
    const r=await fetch(API+path,{...opts,headers});
    const tx=await r.text();let data={};try{data=JSON.parse(tx)}catch{}
    if(!r.ok)throw new Error((data&&data.message)||('HTTP '+r.status));
    return data;
  }
  function resourceFromPush(data){let d=data;for(let i=0;i<6&&d;i++){if(d.goal&&typeof d.goal==='object')return d.goal;if(d.donation&&typeof d.donation==='object')return d.donation;if(d.data&&typeof d.data==='object'){d=d.data;continue}break}return d||{}}
  function rememberDonation(id){if(!id)return;seenIds.add(String(id));const arr=[...seenIds].slice(-200);localStorage.setItem('vampire_seen_donations',arr.join(','))}
  function applyDonation(d){const x=resourceFromPush(d);const id=x.id;const amount=num(x.amount,NaN);if(!Number.isFinite(amount)||amount<=0)return;if(id&&seenIds.has(String(id)))return; if(id)rememberDonation(id);current+=amount;render(current,goal,currencySymbol(x.currency))}
  function applyGoal(d){const x=resourceFromPush(d);const raised=num(x.raised_amount,NaN),target=num(x.goal_amount,NaN);if(Number.isFinite(raised)&&Number.isFinite(target)&&target>0){current=raised;goal=target;render(current,goal,currencySymbol(x.currency))}}

  async function syncDonationHistory(){
    try{
      const result=await api('/alerts/donations?page=1');
      const list=Array.isArray(result.data)?result.data:[];
      if(!list.length)return;
      list.sort((a,b)=>(Number(a.id)||0)-(Number(b.id)||0));
      if(!historyInitialized){
        const newest=Number(list[list.length-1].id)||0;
        lastDonationId=newest;localStorage.setItem('vampire_last_donation_id',String(newest));
        list.forEach(x=>{if(x.id)rememberDonation(x.id)});
        historyInitialized=true;localStorage.setItem('vampire_history_initialized','1');
        return;
      }
      let changed=false;
      for(const d of list){
        const id=Number(d.id)||0;
        if(id>lastDonationId && id>0){applyDonation(d);lastDonationId=Math.max(lastDonationId,id);changed=true}
      }
      if(changed)localStorage.setItem('vampire_last_donation_id',String(lastDonationId));
    }catch(e){console.warn('Donation history sync',e)}
  }

  async function connect(){
    if(!accessToken||!API)return;
    try{
      const me=await api('/user/oauth');
      const user=me.data||me;
      if(!user.id||!user.socket_connection_token)throw new Error('Не удалось получить данные DonationAlerts');
      socket=new WebSocket(WS);
      socket.onopen=()=>socket.send(JSON.stringify({params:{token:user.socket_connection_token},id:1}));
      socket.onmessage=async ev=>{
        let msg;try{msg=JSON.parse(ev.data)}catch{return}
        if(msg.id===1&&msg.result&&msg.result.client){
          try{
            const channels=[`$alerts:donation_${user.id}`,`$goals:goal_${user.id}`];
            const sub=await api('/centrifuge/subscribe',{method:'POST',body:JSON.stringify({channels,client:msg.result.client})});
            const creds=Array.isArray(sub.channels)?sub.channels:[];
            creds.forEach(c=>{if(c.channel&&c.token)socket.send(JSON.stringify({method:1,params:{channel:c.channel,token:c.token},id:Date.now()+Math.floor(Math.random()*1000)}))});
          }catch(e){console.warn('DA subscribe',e)}
          return;
        }
        if(msg.push){
          const channel=msg.push.channel||'';
          const data=(msg.push.pub&&msg.push.pub.data)||msg.push.pub||{};
          if(channel.startsWith('$goals:goal_'))applyGoal(data);
          else if(channel.startsWith('$alerts:donation_'))applyDonation(data);
        }
      };
      socket.onclose=()=>setTimeout(connect,5000);
    }catch(e){console.warn('DonationAlerts connection',e)}
  }

  if(accessToken&&API){
    syncDonationHistory();
    setInterval(syncDonationHistory,5000);
    connect();
  }
})();
</script>
</body>
</html>
