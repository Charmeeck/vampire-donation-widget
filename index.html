<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1672,height=941,initial-scale=1">
<title>Vampire Donation Widget</title>
<style>
html,body{margin:0;width:1672px;height:941px;background:transparent;overflow:hidden}
#stage,.layer{position:absolute;left:0;top:0;width:1672px;height:941px}
.text{font-family:Georgia,"Times New Roman",serif;font-weight:700;fill:#fff;paint-order:stroke;stroke:#1b0a0a;stroke-width:3px}
.sum{font-size:66px}
</style>
</head>
<body>
<div id="stage">
  <img class="layer" src="altar.png" alt="">
  <svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <clipPath id="clip"><rect x="707" y="350" width="264" height="455" rx="62"/></clipPath>
      <linearGradient id="barRed" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff5864"/><stop offset=".18" stop-color="#ed1c35"/><stop offset=".6" stop-color="#a70018"/><stop offset="1" stop-color="#4d0009"/>
      </linearGradient>
      <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff5864"/><stop offset=".18" stop-color="#ed1c35"/><stop offset=".6" stop-color="#a70018"/><stop offset="1" stop-color="#4d0009"/>
      </linearGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="redBarTexture" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="
          1.25 0.20 0.10 0 0.10
          0.06 0.02 0.01 0 0.01
          0.05 0.01 0.01 0 0.01
          0    0    0    1 0"/>
      </filter>
    </defs>
    <!-- Make the whole top bar perfectly symmetrical by mirroring the original red left half. -->
    <defs>
      <clipPath id="rightInnerBar">
        <path d="M836 108 H1580
                 C1622 108 1640 135 1640 172
                 C1640 214 1622 240 1580 240
                 H836 Z"/>
      </clipPath>
    </defs>
    <g clip-path="url(#rightInnerBar)" pointer-events="none">
      <g transform="translate(1672 0) scale(-1 1)">
        <image href="altar.png" x="0" y="0" width="1672" height="941"/>
      </g>
    </g>
    <!-- Subtle mirrored ornament line inside the bar. -->
    <path d="M900 171 C980 154 1060 154 1140 171 C1220 188 1300 188 1380 171 C1440 158 1490 158 1530 171"
          fill="none" stroke="#f0d7cf" stroke-width="2.5" opacity=".55" pointer-events="none"/>
    <path d="M1530 171 C1490 184 1440 184 1380 171 C1300 154 1220 154 1140 171 C1060 188 980 188 900 171"
          fill="none" stroke="#7f0012" stroke-width="1.2" opacity=".55" pointer-events="none"/>
    <g clip-path="url(#clip)">
      <image id="tex" href="blood-texture.png" x="707" y="350" width="264" height="455" preserveAspectRatio="none" opacity=".66"/>
      <rect id="tint" x="707" y="350" width="264" height="455" fill="url(#blood)" opacity=".42"/>
      <ellipse id="surface" cx="839" cy="805" rx="128" ry="10" fill="#ff4657" opacity=".9" filter="url(#blur)"/>
    </g>
    <g opacity=".38"><rect x="721" y="360" width="18" height="430" rx="9" fill="#fff"/><rect x="918" y="360" width="11" height="425" rx="5.5" fill="#fff"/></g>
  </svg>
  <svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg">
    <text id="sumCurrent" class="text sum" x="220" y="203" text-anchor="start" dominant-baseline="middle">0 ₽</text>
    <text id="sumGoal" class="text sum" x="1450" y="203" text-anchor="end" dominant-baseline="middle">10 000 ₽</text>
  </svg>
</div>
<script src="config.js"></script>
<script>
(()=>{
  const CFG=window.VAMPIRE_CONFIG||{};
  const q=new URLSearchParams(location.search);
  const hash=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/,''));  
  const num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d};
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

  // OAuth callback for the legacy/setup flow.
  const token=hash.get('access_token');
  const state=hash.get('state')||'';
  if(token){
    localStorage.setItem('vampire_access_token',token);
    if(state==='control'){
      location.replace('./control.html');
      return;
    }
    history.replaceState({},'',location.pathname+location.search);
  }

  const proxy=(localStorage.getItem('vampire_proxy_url')||CFG.PROXY_URL||'').replace(/\/$/,'');
  const API=proxy?proxy+'/api/v1':'';
  const publicUid=q.get('uid');

  let current=num(q.get('current'),num(localStorage.getItem('vampire_current'),0));
  let goal=num(q.get('goal'),num(localStorage.getItem('vampire_goal'),10000));

  function render(c,g,symbol='₽'){
    c=num(c);g=num(g,1);
    const p=clamp(c/g*100,0,100);
    const bottom=805,full=455,top=Math.round(bottom-full*p/100);
    const height=Math.max(0,bottom-top);

    const tex=document.getElementById('tex');
    const tint=document.getElementById('tint');
    const surface=document.getElementById('surface');
    if(tex){tex.setAttribute('y',top);tex.setAttribute('height',height);}
    if(tint){tint.setAttribute('y',top);tint.setAttribute('height',height);}
    if(surface)surface.setAttribute('cy',top);

    document.getElementById('sumCurrent').textContent=Math.round(c).toLocaleString('ru-RU')+' '+symbol;
    document.getElementById('sumGoal').textContent=Math.round(g).toLocaleString('ru-RU')+' '+symbol;

    localStorage.setItem('vampire_current',String(c));
    localStorage.setItem('vampire_goal',String(g));
  }

  render(current,goal,'₽');

  async function publicState(){
    if(!publicUid||!proxy)return;
    try{
      const r=await fetch(proxy+'/public-state?uid='+encodeURIComponent(publicUid),{cache:'no-store'});
      if(!r.ok)return;
      const s=await r.json();
      const c=num(s.current,NaN),g=num(s.goal,NaN);
      if(Number.isFinite(c)&&c>=0&&Number.isFinite(g)&&g>0){
        current=c;
        goal=g;
        render(current,goal,'₽');
      }
    }catch(e){}
  }

  // Standalone widget mode: no DonationAlerts token is needed here.
  // The control panel is the only source that talks to DonationAlerts.
  if(publicUid&&API){
    publicState();
    setInterval(publicState,3000);
    return;
  }

  const accessToken=localStorage.getItem('vampire_access_token')||'';
  if(!accessToken||!API)return;

  async function api(path,opts={}){
    const headers={...(opts.headers||{}),Authorization:'Bearer '+accessToken};
    if(opts.method==='POST')headers['Content-Type']='application/json';
    const r=await fetch(API+path,{...opts,headers});
    const tx=await r.text();let data={};try{data=JSON.parse(tx)}catch{}
    if(!r.ok)throw new Error(data.message||('HTTP '+r.status));
    return data;
  }

  // Legacy mode: keep existing authenticated widget behavior for compatibility.
  async function loadState(){
    try{
      const s=await api('/state');
      if(Number.isFinite(Number(s.current))&&Number(s.current)>=0)current=Number(s.current);
      if(Number.isFinite(Number(s.goal))&&Number(s.goal)>0)goal=Number(s.goal);
      render(current,goal,'₽');
    }catch(e){}
  }

  loadState();
  setInterval(loadState,5000);
})();
</script>
</body>
</html>
