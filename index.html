<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vampire Donation Widget</title>
<style>
html,body{margin:0;padding:0;background:transparent;width:100%;height:100%;overflow:hidden}
.art-frame{position:relative;width:100%;max-width:1672px;aspect-ratio:1672/941;margin:0 auto}
.art-frame img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.donation-bar{position:absolute;left:11.2%;top:11.4%;width:77.2%;height:8.8%;border-radius:999px;background:linear-gradient(#17171d,#08080b);box-shadow:0 0 0 3px rgba(25,25,30,.95),0 5px 12px rgba(0,0,0,.55);overflow:hidden;box-sizing:border-box}
.donation-fill{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:999px;background:linear-gradient(180deg,#ff3040 0%,#d80d20 52%,#a60614 100%);box-shadow:inset 0 2px 5px rgba(255,255,255,.18),0 0 12px rgba(255,0,30,.25);transition:width .5s ease}
.donation-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:bold clamp(16px,2.15vw,34px) Georgia,serif;text-shadow:0 2px 3px #000;pointer-events:none;white-space:nowrap}
.donation-percent{position:absolute;right:1.8%;top:50%;transform:translateY(-50%);color:#fff;font:bold clamp(11px,1.25vw,20px) Georgia,serif;text-shadow:0 2px 3px #000;pointer-events:none}
@media(max-width:600px){.donation-text{font-size:16px}.donation-percent{font-size:10px}}
</style>
</head>
<body>
<div class="art-frame">
<img class="art" src="altar.png" alt="Vampire Donation Widget">
<div class="donation-bar">
<div id="fill" class="donation-fill"></div>
<div id="text" class="donation-text">0 ₽ / 10 000 ₽</div>
<div id="percent" class="donation-percent">0%</div>
</div>
</div>
<script>
const p=new URLSearchParams(location.search);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let current=Number(p.get('current'));
let goal=Number(p.get('goal'));
try{const s=JSON.parse(localStorage.getItem('vampire_settings')||'{}');if(!p.has('current')&&s.current!=null)current=Number(s.current);if(!p.has('goal')&&s.goal!=null)goal=Number(s.goal)}catch{}
if(!Number.isFinite(current))current=0;if(!Number.isFinite(goal)||goal<=0)goal=10000;
if(p.has('demo'))current+=Number(p.get('demo'))||0;
const pct=clamp(current/goal*100,0,100);
document.getElementById('fill').style.width=pct+'%';
document.getElementById('text').textContent=Math.round(current).toLocaleString('ru-RU')+' ₽ / '+Math.round(goal).toLocaleString('ru-RU')+' ₽';
document.getElementById('percent').textContent=Math.round(pct)+'%';
</script>
</body>
</html>
