<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vampire Donation Widget</title><style>
html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%} .widget{position:relative;width:min(100vw,1672px);aspect-ratio:1672/941;margin:0 auto;overflow:hidden}.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}.overlay{position:absolute;inset:0;width:100%;height:100%}.amount{font:700 34px Georgia,serif;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#111;stroke-width:3px}.pct{font:700 18px Georgia,serif;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#111;stroke-width:2px}</style></head><body><div class="widget"><img class="base" src="altar.png"><svg class="overlay" viewBox="0 0 1672 941" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="barClip"><rect x="185" y="163" width="1288" height="73" rx="36"/></clipPath><linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#191a20"/><stop offset="1" stop-color="#07080c"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3144"/><stop offset=".45" stop-color="#d80e22"/><stop offset="1" stop-color="#8d0612"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".55"/></filter></defs>
<g clip-path="url(#barClip)"><rect x="185" y="163" width="1288" height="73" fill="url(#dark)"/><rect id="fill" x="185" y="163" width="0" height="73" fill="url(#red)"/></g>
<!-- central jewel is already part of altar.png, so it remains visible over the dynamic bar -->
<text id="amount" class="amount" x="836" y="209">0 ₽ / 10 000 ₽</text><text id="pct" class="pct" x="1434" y="209">0%</text></svg></div><script>
const p=new URLSearchParams(location.search);let current=Number(p.get('current')||0),goal=Number(p.get('goal')||10000);try{const s=JSON.parse(localStorage.getItem('vampire_settings')||'{}');if(!p.has('current')&&s.current!=null)current=Number(s.current);if(!p.has('goal')&&s.goal!=null)goal=Number(s.goal)}catch{}if(p.has('demo'))current+=Number(p.get('demo'))||0;function setProgress(c,g){c=Number(c)||0;g=Number(g)||1;const pct=Math.max(0,Math.min(100,c/g*100));document.getElementById('fill').setAttribute('width',1288*pct/100);document.getElementById('amount').textContent=Math.round(c).toLocaleString('ru-RU')+' ₽ / '+Math.round(g).toLocaleString('ru-RU')+' ₽';document.getElementById('pct').textContent=Math.round(pct)+'%'}setProgress(current,goal);window.setDonationProgress=setProgress;
</script></body></html>
