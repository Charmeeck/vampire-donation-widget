<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=1672,height=941,initial-scale=1"><title>Vampire Donation Widget</title>
<style>html,body{margin:0;width:1672px;height:941px;background:transparent;overflow:hidden}#stage,.layer{position:absolute;left:0;top:0;width:1672px;height:941px}.text{font-family:Georgia,"Times New Roman",serif;font-weight:700;fill:#fff;paint-order:stroke;stroke:#1b0a0a;stroke-width:3px}.sum{font-size:34px}.pct{font-size:22px}</style></head><body><div id="stage">
<img class="layer" src="altar.png" alt="">
<svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg">
<defs>
<clipPath id="clip"><rect x="707" y="350" width="264" height="455" rx="62"/></clipPath>
<linearGradient id="blood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5864"/><stop offset=".18" stop-color="#ed1c35"/><stop offset=".6" stop-color="#a70018"/><stop offset="1" stop-color="#4d0009"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
<g clip-path="url(#clip)"><image id="tex" href="blood-texture.png" x="707" y="350" width="264" height="455" preserveAspectRatio="none" opacity=".66"/><rect id="tint" x="707" y="350" width="264" height="455" fill="url(#blood)" opacity=".42"/><ellipse id="surface" cx="839" cy="805" rx="128" ry="10" fill="#ff4657" opacity=".9" filter="url(#blur)"/></g>
<!-- subtle glass sheen, always present -->
<g opacity=".38"><rect x="721" y="360" width="18" height="430" rx="9" fill="#fff"/><rect x="918" y="360" width="11" height="425" rx="5.5" fill="#fff"/></g>
</svg>
<svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg"><text id="sum" class="text sum" x="836" y="140" text-anchor="middle">0 ₽ / 10 000 ₽</text><text id="pct" class="text pct" x="1500" y="140" text-anchor="middle">0%</text></svg>
</div>
<script>
const q=new URLSearchParams(location.search),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let current=Number(q.get('current')??localStorage.getItem('vampire_current')??4750),goal=Number(q.get('goal')??localStorage.getItem('vampire_goal')??10000);
function setProgress(c,g){c=Number(c)||0;g=Number(g)||1;const p=clamp(c/g*100,0,100),bottom=805,full=455,top=Math.round(bottom-full*p/100),h=bottom-top;const t=document.getElementById('tex'),ti=document.getElementById('tint');t.setAttribute('y',top);t.setAttribute('height',Math.max(0,h));ti.setAttribute('y',top);ti.setAttribute('height',Math.max(0,h));document.getElementById('surface').setAttribute('cy',top);document.getElementById('sum').textContent=Math.round(c).toLocaleString('ru-RU')+' ₽ / '+Math.round(g).toLocaleString('ru-RU')+' ₽';document.getElementById('pct').textContent=Math.round(p)+'%';}
window.setDonationProgress=setProgress;setProgress(current,goal);
</script></body></html>
