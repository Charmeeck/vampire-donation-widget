<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1672,height=941,initial-scale=1">
<title>Vampire Donation Widget</title>
<style>
html,body{margin:0;width:1672px;height:941px;background:transparent;overflow:hidden}
#stage,.layer{position:absolute;left:0;top:0;width:1672px;height:941px}
.text{font-family:Georgia,"Times New Roman",serif;font-weight:700;fill:#fff;paint-order:stroke;stroke:#1b0a0a;stroke-width:3px}
.sum{font-size:36px}
</style>
</head>
<body>
<div id="stage">
  <img class="layer" src="altar.png" alt="">
  <svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <clipPath id="clip"><rect x="707" y="350" width="264" height="455" rx="62"/></clipPath>
      <linearGradient id="barRed" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff5864"/><stop offset=".18" stop-color="#ed1c35"/><stop offset=".6" stop-color="#a70018"/><stop offset="1" stop-color="#4d0009"/>
      </linearGradient>
      <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff5864"/><stop offset=".18" stop-color="#ed1c35"/><stop offset=".6" stop-color="#a70018"/><stop offset="1" stop-color="#4d0009"/>
      </linearGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="redBarTexture" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="
          1.25 0.20 0.10 0 0.10
          0.06 0.02 0.01 0 0.01
          0.05 0.01 0.01 0 0.01
          0    0    0    1 0"/>
      </filter>
    </defs>
    <!-- Make the whole top bar perfectly symmetrical by mirroring the original red left half. -->
    <defs>
      <clipPath id="rightInnerBar">
        <path d="M836 126 H1518
                 C1546 126 1561 141 1561 170
                 C1561 198 1546 216 1518 216
                 H836 Z"/>
      </clipPath>
    </defs>
    <g clip-path="url(#rightInnerBar)" pointer-events="none">
      <g transform="translate(1672 0) scale(-1 1)">
        <image href="altar.png" x="0" y="0" width="1672" height="941"/>
      </g>
    </g>
    <!-- Subtle mirrored ornament line inside the bar. -->
    <path d="M900 171 C980 154 1060 154 1140 171 C1220 188 1300 188 1380 171 C1440 158 1490 158 1530 171"
          fill="none" stroke="#f0d7cf" stroke-width="2.5" opacity=".55" pointer-events="none"/>
    <path d="M1530 171 C1490 184 1440 184 1380 171 C1300 154 1220 154 1140 171 C1060 188 980 188 900 171"
          fill="none" stroke="#7f0012" stroke-width="1.2" opacity=".55" pointer-events="none"/>
    <g clip-path="url(#clip)">
      <image id="tex" href="blood-texture.png" x="707" y="350" width="264" height="455" preserveAspectRatio="none" opacity=".66"/>
      <rect id="tint" x="707" y="350" width="264" height="455" fill="url(#blood)" opacity=".42"/>
      <ellipse id="surface" cx="839" cy="805" rx="128" ry="10" fill="#ff4657" opacity=".9" filter="url(#blur)"/>
    </g>
    <g opacity=".38"><rect x="721" y="360" width="18" height="430" rx="9" fill="#fff"/><rect x="918" y="360" width="11" height="425" rx="5.5" fill="#fff"/></g>
  </svg>
  <svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg">
    <text id="sumCurrent" class="text sum" x="220" y="203" text-anchor="start" dominant-baseline="middle">0 ₽</text>
    <text id="sumGoal" class="text sum" x="1450" y="203" text-anchor="end" dominant-baseline="middle">10 000 ₽</text>
  </svg>
</div>
<script src="config.js"></script>
<script>
(()=> {
  const CFG=window.VAMPIRE_CONFIG||{};
  const q=new URLSearchParams(location.search);
  const hash=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/,''));
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d};

  // OAuth implicit callback
  const token=hash.get('access_token');
  if(token){
    localStorage.setItem('vampire_access_token',token);
    history.replaceState({},'',location.pathname+location.search);
  }

  const START_AMOUNT=150;
  const storedCurrent=num(localStorage.getItem('vampire_current'),START_AMOUNT);
  let current=q.has('current')?num(q.get('current'),START_AMOUNT):(storedCurrent>0?storedCurrent:START_AMOUNT);
  let goal=num(q.get('goal'),num(localStorage.getItem('vampire_goal'),10000));
  if(current<0)current=0;
  if(goal<=0)goal=10000;

  const accessToken=localStorage.getItem('vampire_access_token')||'';
  const proxy=(localStorage.getItem('vampire_proxy_url')||CFG.PROXY_URL||'').replace(/\/$/,'');
  const API=proxy?proxy+'/api/v1':'';
  const WS='wss://centrifugo.donationalerts.com/connection/websocket';

  let socket=null,reconnectTimer=null;
  const seen=new Set((localStorage.getItem('vampire_seen_donations')||'').split(',').filter(Boolean));

  function currencySymbol(code){
    return ({RUB:'₽',EUR:'€',USD:'$',GBP:'£',KZT:'₸',UAH:'₴',BYN:'Br',BRL:'R$',TRY:'₺'})[code]||'₽';
  }

  function render(c,g,symbol='₽'){
    c=num(c);g=num(g,1);
    const p=clamp(c/g*100,0,100);
    const bottom=805,full=455;
    const top=Math.round(bottom-full*p/100);
    const height=Math.max(0,bottom-top);
    const tex=document.getElementById('tex');
    const tint=document.getElementById('tint');
    const surface=document.getElementById('surface');
    if(tex){tex.setAttribute('y',top);tex.setAttribute('height',height);}
    if(tint){tint.setAttribute('y',top);tint.setAttribute('height',height);}
    if(surface)surface.setAttribute('cy',top);
    document.getElementById('sumCurrent').textContent=Math.round(c).toLocaleString('ru-RU')+' '+symbol;
    document.getElementById('sumGoal').textContent=Math.round(g).toLocaleString('ru-RU')+' '+symbol;
    localStorage.setItem('vampire_current',String(c));
    localStorage.setItem('vampire_goal',String(g));
  }

  render(current,goal,'₽');

  async function api(path,opts={}){
    if(!API)throw new Error('Worker proxy не настроен');
    const headers={...(opts.headers||{}),Authorization:'Bearer '+accessToken};
    if(opts.method==='POST')headers['Content-Type']='application/json';
    const r=await fetch(API+path,{...opts,headers});
    const tx=await r.text();
    let data={};try{data=JSON.parse(tx)}catch{}
    if(!r.ok)throw new Error((data&&data.message)||('HTTP '+r.status));
    return data;
  }

  function remember(id){
    if(id===undefined||id===null)return;
    seen.add(String(id));
    localStorage.setItem('vampire_seen_donations',[...seen].slice(-500).join(','));
  }

  // DonationAlerts' websocket payload is:
  // result -> channel, data -> seq, data -> donation/goal resource.
  function unwrap(value,depth=0){
    if(!value||typeof value!=='object'||depth>8)return null;
    if(Number.isFinite(Number(value.goal_amount))&&Number.isFinite(Number(value.raised_amount)))
      return {kind:'goal',data:value};
    if(Number.isFinite(Number(value.amount)) && value.currency)
      return {kind:'donation',data:value};
    if(Array.isArray(value)){
      for(const v of value){const r=unwrap(v,depth+1);if(r)return r;}
      return null;
    }
    for(const k of Object.keys(value)){
      const r=unwrap(value[k],depth+1);if(r)return r;
    }
    return null;
  }

  function applyGoal(payload){
    const r=unwrap(payload);
    if(!r||r.kind!=='goal')return;
    const d=r.data;
    const raised=num(d.raised_amount,NaN);
    const target=num(d.goal_amount,NaN);
    if(Number.isFinite(raised)&&Number.isFinite(target)&&target>0){
      // The user chose 100 RUB as the starting amount. Do not let a newly
      // created DonationAlerts goal with 0 raised reset that starting value.
      current=raised>0?raised:Math.max(current,START_AMOUNT);
      goal=target;
      render(current,goal,currencySymbol(d.currency));
    }
  }

  function applyDonation(payload){
    const r=unwrap(payload);
    if(!r||r.kind!=='donation')return;
    const d=r.data;
    const amount=num(d.amount_in_user_currency,d.amount);
    if(!Number.isFinite(amount)||amount<=0)return;
    const id=d.id;
    if(id!==undefined&&id!==null&&seen.has(String(id)))return;
    remember(id);
    current+=amount;
    render(current,goal,currencySymbol(d.currency));
  }

  async function syncHistory(){
    if(!accessToken||!API)return;
    try{
      // Always ask for the newest page. This catches manual/test donations
      // even when Centrifugo does not emit a publication for them.
      const result=await api('/alerts/donations?page=1');
      const list=Array.isArray(result.data)?result.data:[];
      if(!list.length)return;

      // On the first history read, remember existing records but do not add
      // them: the starting value of a newly created goal is controlled by
      // the goal event or the setup value.
      const firstSync=!localStorage.getItem('vampire_history_baseline_v3');
      if(firstSync){
        // One-time recovery: include only very recent donations so a test
        // donation made just before this build is not lost.
        const since=Date.now()-20*60*1000;
        for(const d of list){
          const ts=Date.parse(String(d.created_at||'').replace(' ','T'));
          const isRecent=Number.isFinite(ts) ? ts>=since : false;
          if(isRecent && d && d.id!==undefined && d.id!==null) applyDonation(d);
          else if(d&&d.id!==undefined&&d.id!==null) remember(d.id);
        }
        localStorage.setItem('vampire_history_baseline_v3','1');
        return;
      }

      // Process every unseen donation, regardless of numeric ID ordering.
      for(const d of list){
        if(d&&d.id!==undefined&&d.id!==null&&!seen.has(String(d.id))){
          applyDonation(d);
        }
      }
    }catch(e){
      console.warn('Donation history sync failed:',e);
    }
  }

  async function connect(){
    if(!accessToken||!API)return;
    try{
      const me=await api('/user/oauth');
      const u=me.data||me;
      if(!u.id||!u.socket_connection_token)throw new Error('DonationAlerts profile/token unavailable');

      socket=new WebSocket(WS);

      socket.onopen=()=>{
        socket.send(JSON.stringify({
          params:{token:u.socket_connection_token},
          id:1
        }));
      };

      socket.onmessage=async(event)=>{
        let msg;try{msg=JSON.parse(event.data)}catch{return};

        if(msg.id===1&&msg.result&&msg.result.client){
          try{
            const channels=[
              '$alerts:donation_'+u.id,
              '$goals:goal_'+u.id
            ];
            const sub=await api('/centrifuge/subscribe',{
              method:'POST',
              body:JSON.stringify({channels,client:msg.result.client})
            });
            const creds=Array.isArray(sub.channels)?sub.channels:[];
            creds.forEach((c,i)=>{
              if(!c.channel||!c.token)return;
              socket.send(JSON.stringify({
                method:1,
                params:{channel:c.channel,token:c.token},
                id:100+i
              }));
            });
          }catch(e){console.warn('DonationAlerts subscribe failed:',e);}
          return;
        }

        if(msg.push){
          const channel=msg.push.channel||'';
          const payload=msg.push.pub&&msg.push.pub.data!==undefined
            ? msg.push.pub.data
            : (msg.push.pub||{});

          if(channel.indexOf('$goals:goal_')===0)applyGoal(payload);
          if(channel.indexOf('$alerts:donation_')===0)applyDonation(payload);
        }
      };

      socket.onerror=e=>console.warn('DonationAlerts WebSocket error',e);
      socket.onclose=()=>{reconnectTimer=setTimeout(connect,5000);};
    }catch(e){
      console.warn('DonationAlerts connection failed:',e);
      reconnectTimer=setTimeout(connect,5000);
    }
  }

  if(accessToken&&API){
    syncHistory();
    setInterval(syncHistory,3000);
    connect();
  }
})();
</script>
</body>
</html>
