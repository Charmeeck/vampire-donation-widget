<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1672,height=941,initial-scale=1">
<title>Vampire Donation Widget</title>
<style>
html,body{margin:0;width:1672px;height:941px;background:transparent;overflow:hidden}
#stage,.layer{position:absolute;left:0;top:0;width:1672px;height:941px}
.text{font-family:Georgia,"Times New Roman",serif;font-weight:700;fill:#fff;paint-order:stroke;stroke:#1b0a0a;stroke-width:3px}
.sum{font-size:66px}
</style>
</head>
<body>
<div id="stage">
  <img class="layer" src="altar.png" alt="">
  <svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <clipPath id="clip"><rect x="707" y="350" width="264" height="455" rx="62"/></clipPath>
      <linearGradient id="barRed" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff5864"/><stop offset=".18" stop-color="#ed1c35"/><stop offset=".6" stop-color="#a70018"/><stop offset="1" stop-color="#4d0009"/>
      </linearGradient>
      <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff5864"/><stop offset=".18" stop-color="#ed1c35"/><stop offset=".6" stop-color="#a70018"/><stop offset="1" stop-color="#4d0009"/>
      </linearGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="redBarTexture" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="
          1.25 0.20 0.10 0 0.10
          0.06 0.02 0.01 0 0.01
          0.05 0.01 0.01 0 0.01
          0    0    0    1 0"/>
      </filter>
    </defs>
    <!-- Make the whole top bar perfectly symmetrical by mirroring the original red left half. -->
    <defs>
      <clipPath id="rightInnerBar">
        <path d="M836 108 H1580
                 C1622 108 1640 135 1640 172
                 C1640 214 1622 240 1580 240
                 H836 Z"/>
      </clipPath>
    </defs>
    <g clip-path="url(#rightInnerBar)" pointer-events="none">
      <g transform="translate(1672 0) scale(-1 1)">
        <image href="altar.png" x="0" y="0" width="1672" height="941"/>
      </g>
    </g>
    <!-- Subtle mirrored ornament line inside the bar. -->
    <path d="M900 171 C980 154 1060 154 1140 171 C1220 188 1300 188 1380 171 C1440 158 1490 158 1530 171"
          fill="none" stroke="#f0d7cf" stroke-width="2.5" opacity=".55" pointer-events="none"/>
    <path d="M1530 171 C1490 184 1440 184 1380 171 C1300 154 1220 154 1140 171 C1060 188 980 188 900 171"
          fill="none" stroke="#7f0012" stroke-width="1.2" opacity=".55" pointer-events="none"/>
    <g clip-path="url(#clip)">
      <image id="tex" href="blood-texture.png" x="707" y="350" width="264" height="455" preserveAspectRatio="none" opacity=".66"/>
      <rect id="tint" x="707" y="350" width="264" height="455" fill="url(#blood)" opacity=".42"/>
      <ellipse id="surface" cx="839" cy="805" rx="128" ry="10" fill="#ff4657" opacity=".9" filter="url(#blur)"/>
    </g>
    <g opacity=".38"><rect x="721" y="360" width="18" height="430" rx="9" fill="#fff"/><rect x="918" y="360" width="11" height="425" rx="5.5" fill="#fff"/></g>
  </svg>
  <svg class="layer" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg">
    <text id="sumCurrent" class="text sum" x="220" y="203" text-anchor="start" dominant-baseline="middle">0 ₽</text>
    <text id="sumGoal" class="text sum" x="1450" y="203" text-anchor="end" dominant-baseline="middle">10 000 ₽</text>
  </svg>
</div>
<script src="config.js"></script>
<script>
(()=>{
  'use strict';
  const CFG=window.VAMPIRE_CONFIG||{};
  const params=new URLSearchParams(location.search);
  const hash=new URLSearchParams((location.hash||'').startsWith('#')?location.hash.slice(1):(location.hash||''));

  function readStore(key){
    try{const value=window.localStorage.getItem(key);if(value!==null)return value;}catch(e){}
    try{const value=window.sessionStorage.getItem(key);if(value!==null)return value;}catch(e){}
    return null;
  }
  function writeStore(key,value){
    let saved=false;
    try{window.localStorage.setItem(key,String(value));if(window.localStorage.getItem(key)===String(value))saved=true;}catch(e){}
    try{window.sessionStorage.setItem(key,String(value));if(window.sessionStorage.getItem(key)===String(value))saved=true;}catch(e){}
    return saved;
  }
  function removeStore(key){
    try{window.localStorage.removeItem(key);}catch(e){}
    try{window.sessionStorage.removeItem(key);}catch(e){}
  }
  const num=(value,fallback=0)=>{
    const n=Number(value);
    return Number.isFinite(n)?n:fallback;
  };
  const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));

  // DonationAlerts returns both the access token and OAuth state in the URL hash.
  let callbackState=null;
  const stateText=hash.get('state');
  if(stateText){
    try{
      const parsed=JSON.parse(stateText);
      if(parsed&&parsed.version===1)callbackState=parsed;
    }catch(e){}
  }
  const returnedToken=hash.get('access_token');
  if(returnedToken)writeStore('vampire_access_token',returnedToken);

  if(callbackState){
    if(Number.isFinite(Number(callbackState.current))&&Number(callbackState.current)>=0)
      writeStore('vampire_current',Number(callbackState.current));
    if(Number.isFinite(Number(callbackState.goal))&&Number(callbackState.goal)>0)
      writeStore('vampire_goal',Number(callbackState.goal));
    if(typeof callbackState.proxy==='string'&&callbackState.proxy.startsWith('https://'))
      writeStore('vampire_proxy_url',callbackState.proxy);
  }

  if(returnedToken||callbackState){
    try{history.replaceState({},'',location.pathname+location.search);}catch(e){}
  }

  let current=params.has('current')
    ? num(params.get('current'),0)
    : num(readStore('vampire_current'),0);
  let goal=params.has('goal')
    ? num(params.get('goal'),10000)
    : num(readStore('vampire_goal'),10000);
  if(current<0)current=0;
  if(goal<=0)goal=10000;
  if(params.has('current'))writeStore('vampire_current',current);
  if(params.has('goal'))writeStore('vampire_goal',goal);

  const token=readStore('vampire_access_token')||'';
  let proxy=readStore('vampire_proxy_url')||callbackState?.proxy||CFG.PROXY_URL||'';
  proxy=String(proxy).trim();
  while(proxy.endsWith('/'))proxy=proxy.slice(0,-1);
  const API=proxy?proxy+'/api/v1':'';
  const WS='wss://centrifugo.donationalerts.com/connection/websocket';

  let socket=null;
  let reconnectTimer=null;
  let historyBusy=false;
  let historyReady=readStore('vampire_single_history_ready')==='1';
  const seen=new Set((readStore('vampire_single_seen')||'').split(',').filter(Boolean));

  function render(){
    const percentage=goal>0?clamp(current/goal*100,0,100):0;
    const bottom=805,full=455;
    const top=Math.round(bottom-full*percentage/100);
    const fillHeight=Math.max(0,bottom-top);
    const texture=document.getElementById('tex');
    const tint=document.getElementById('tint');
    const surface=document.getElementById('surface');
    if(texture){texture.setAttribute('y',top);texture.setAttribute('height',fillHeight);}
    if(tint){tint.setAttribute('y',top);tint.setAttribute('height',fillHeight);}
    if(surface)surface.setAttribute('cy',top);
    const currentNode=document.getElementById('sumCurrent');
    const goalNode=document.getElementById('sumGoal');
    if(currentNode)currentNode.textContent=Math.round(current).toLocaleString('ru-RU')+' ₽';
    if(goalNode)goalNode.textContent=Math.round(goal).toLocaleString('ru-RU')+' ₽';
    writeStore('vampire_current',current);
    writeStore('vampire_goal',goal);
  }

  render();

  async function api(path,options={}){
    if(!API)throw new Error('Cloudflare Worker не настроен');
    const headers={...(options.headers||{}),Authorization:'Bearer '+token};
    if(options.method==='POST')headers['Content-Type']='application/json';
    const response=await fetch(API+path,{...options,headers});
    const responseText=await response.text();
    let data={};
    try{data=JSON.parse(responseText);}catch(e){}
    if(!response.ok)throw new Error(data.message||data.error||('HTTP '+response.status));
    return data;
  }

  function rememberDonation(id){
    if(id===undefined||id===null)return;
    seen.add(String(id));
    writeStore('vampire_single_seen',[...seen].slice(-500).join(','));
  }

  function extractDonation(value,depth=0){
    if(!value||typeof value!=='object'||depth>8)return null;
    if(value.amount_in_user_currency!==undefined||value.amount!==undefined){
      const amount=num(value.amount_in_user_currency??value.amount,NaN);
      if(Number.isFinite(amount)&&amount>0)return value;
    }
    if(Array.isArray(value)){
      for(const item of value){
        const found=extractDonation(item,depth+1);
        if(found)return found;
      }
      return null;
    }
    for(const key of Object.keys(value)){
      const found=extractDonation(value[key],depth+1);
      if(found)return found;
    }
    return null;
  }

  function applyGoal(payload){
    let node=payload;
    for(let i=0;i<8&&node&&typeof node==='object';i++){
      if(node.goal&&typeof node.goal==='object'){node=node.goal;continue;}
      if(node.data&&typeof node.data==='object'){node=node.data;continue;}
      break;
    }
    const raised=num(node&&node.raised_amount,NaN);
    const target=num(node&&node.goal_amount,NaN);
    if(Number.isFinite(raised)&&Number.isFinite(target)&&target>0){
      if(raised>0)current=raised;
      goal=target;
      render();
    }
  }

  function applyDonation(payload){
    const donation=extractDonation(payload);
    if(!donation)return;
    const id=donation.id;
    if(id!==undefined&&id!==null&&seen.has(String(id)))return;
    const amount=num(donation.amount_in_user_currency??donation.amount,NaN);
    if(!Number.isFinite(amount)||amount<=0)return;
    rememberDonation(id);
    current+=amount;
    render();
  }

  async function syncHistory(){
    if(!token||!API||historyBusy)return;
    historyBusy=true;
    try{
      const result=await api('/alerts/donations?page=1');
      const donations=Array.isArray(result.data)?result.data:[];
      if(!historyReady){
        donations.forEach(item=>rememberDonation(item.id));
        historyReady=true;
        writeStore('vampire_single_history_ready','1');
        return;
      }
      donations.sort((a,b)=>(Number(a.id)||0)-(Number(b.id)||0));
      for(const donation of donations){
        if(donation&&donation.id!==undefined&&donation.id!==null&&!seen.has(String(donation.id)))
          applyDonation(donation);
      }
    }catch(error){
      console.warn('Vampire Widget: history sync failed',error);
    }finally{
      historyBusy=false;
    }
  }

  async function connect(){
    if(!token||!API)return;
    try{
      const me=await api('/user/oauth');
      const user=me.data||me;
      if(!user.id||!user.socket_connection_token)
        throw new Error('DonationAlerts не вернул данные подключения');

      socket=new WebSocket(WS);
      socket.onopen=()=>{
        socket.send(JSON.stringify({params:{token:user.socket_connection_token},id:1}));
      };
      socket.onmessage=async(event)=>{
        let message;
        try{message=JSON.parse(event.data);}catch(e){return;}
        if(message.id===1&&message.result&&message.result.client){
          try{
            const subscribed=await api('/centrifuge/subscribe',{
              method:'POST',
              body:JSON.stringify({
                channels:['$alerts:donation_'+user.id,'$goals:goal_'+user.id],
                client:message.result.client
              })
            });
            (subscribed.channels||[]).forEach((channel,index)=>{
              if(channel.channel&&channel.token){
                socket.send(JSON.stringify({
                  method:1,
                  params:{channel:channel.channel,token:channel.token},
                  id:100+index
                }));
              }
            });
          }catch(error){console.warn('Vampire Widget: subscribe failed',error);}
          return;
        }
        if(message.push){
          const channel=message.push.channel||'';
          const payload=message.push.pub&&message.push.pub.data!==undefined
            ?message.push.pub.data:(message.push.pub||{});
          if(channel.indexOf('$goals:goal_')===0)applyGoal(payload);
          if(channel.indexOf('$alerts:donation_')===0)applyDonation(payload);
        }
      };
      socket.onerror=error=>console.warn('Vampire Widget: websocket error',error);
      socket.onclose=()=>{
        if(reconnectTimer)clearTimeout(reconnectTimer);
        reconnectTimer=setTimeout(connect,5000);
      };
    }catch(error){
      console.warn('Vampire Widget: connection failed',error);
      if(reconnectTimer)clearTimeout(reconnectTimer);
      reconnectTimer=setTimeout(connect,5000);
    }
  }

  if(token&&API){
    syncHistory();
    setInterval(syncHistory,5000);
    connect();
  }
})();
</script>
</body>
</html>
