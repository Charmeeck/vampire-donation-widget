<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vampire Donation Widget</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}
.art-frame{position:relative;width:100%;max-width:1672px;aspect-ratio:1672/941;margin:0 auto}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
/* Полоса совмещена с внутренним пазом altar.png */
.donation-bar{position:absolute;left:10.9%;top:12.7%;width:77.8%;height:8.8%;border-radius:999px;overflow:hidden;box-sizing:border-box;background:linear-gradient(180deg,#18171d 0%,#07070a 100%);pointer-events:none}
.donation-fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:999px;background:linear-gradient(180deg,#ff3040 0%,#e00f22 48%,#9b0714 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,.2),0 0 8px rgba(255,20,30,.35);transition:width .5s ease}
.donation-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:bold clamp(12px,1.55vw,25px) Georgia,"Times New Roman",serif;text-shadow:0 2px 3px #000;white-space:nowrap}
.donation-percent{position:absolute;right:1.8%;top:50%;transform:translateY(-50%);color:#fff;font:bold clamp(9px,1vw,17px) Georgia,"Times New Roman",serif;text-shadow:0 2px 3px #000}
</style>
</head>
<body>
<div class="art-frame">
<img class="art" src="altar.png" alt="">
<div class="donation-bar">
<div id="fill" class="donation-fill"></div>
<div id="text" class="donation-text">0 ₽ / 10 000 ₽</div>
<div id="percent" class="donation-percent">0%</div>
</div>
</div>
<script>
const p=new URLSearchParams(location.search),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let current=Number(p.get('current')),goal=Number(p.get('goal'));
try{const s=JSON.parse(localStorage.getItem('vampire_settings')||'{}');if(!p.has('current')&&s.current!=null)current=Number(s.current);if(!p.has('goal')&&s.goal!=null)goal=Number(s.goal)}catch{}
if(!Number.isFinite(current))current=0;
if(!Number.isFinite(goal)||goal<=0)goal=10000;
if(p.has('demo'))current+=Number(p.get('demo'))||0;
const pct=clamp(current/goal*100,0,100);
document.getElementById('fill').style.width=pct+'%';
document.getElementById('text').textContent=Math.round(current).toLocaleString('ru-RU')+' ₽ / '+Math.round(goal).toLocaleString('ru-RU')+' ₽';
document.getElementById('percent').textContent=Math.round(pct)+'%';
</script>
</body>
</html>
